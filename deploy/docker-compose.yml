# The dashboard answers on :8080 before anything is configured, so a first start
# needs nothing but this file. The bearer token is printed to the container log.
services:
  jcc-mirror:
    image: registry.blackforestbytes.com/mikescher/jcc-mirror:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"   # the LAN dashboard; the one inside the tunnel needs no mapping
    volumes:
      - ./data:/data                # sqlite state, the WireGuard identity, DB backups
      - /volume1/media:/mnt/media
      - /volume1/clipcorn:/mnt/clipcorn
    # The uid/gid that owns the media share. Docker applies it before the process
    # starts, so there is no privilege-dropping entrypoint and no PUID/PGID - and
    # without it every transfer fails at its last syscall, the rename.
    user: "1026:100"

    # The mirror and the diagnostics run in the same image and read the same
    # settings, so neither needs anything passing to it twice:
    #   docker compose run --rm jcc-mirror pairs -data /data
    #   docker compose run --rm jcc-mirror sync  -data /data -pair media
    #   docker compose run --rm jcc-mirror walk  -data /data -workers 8
