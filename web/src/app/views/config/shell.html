<section class="panel head">
  <div class="spread">
    <h2>{{ page()?.label }}</h2>
    <div class="row">
      @if (store.loading()) {
        <span class="note">loading…</span>
      }
      <button class="ghost small" type="button" (click)="store.load()">Refresh</button>
    </div>
  </div>

  @if (page(); as open) {
    <p class="note">{{ open.blurb }}</p>
  }
</section>

@if (store.error()) {
  <div class="banner">{{ store.error() }}</div>
}

<router-outlet (activate)="activated()" />
